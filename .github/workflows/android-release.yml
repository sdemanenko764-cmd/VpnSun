# Builds the Android APK from the published source archive on a Linux runner:
# libbox (sing-box for Android) with gomobile, then the Tauri app, then signs,
# inspects and publishes the APK next to the Windows builds.
# Branch android-dev is used to iterate without touching the Windows releases.
name: Sun VPN Android release
on:
  push:
    branches: [main, android-dev]
    paths: [downloads/Sun-VPN-*-source.zip, .github/workflows/android-release.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Verify and unpack source archive
        id: source
        run: |
          # Highest version by name (checkout gives every file the same mtime).
          zip=$(ls downloads/Sun-VPN-*-source.zip | sed -E 's#.*/Sun-VPN-(.*)-source\.zip#\1 &#' | sort -V | tail -1 | cut -d' ' -f2)
          expected=$(cut -d' ' -f1 "$zip.sha256")
          actual=$(sha256sum "$zip" | cut -d' ' -f1)
          [ "$actual" = "$expected" ] || { echo "Source archive SHA-256 mismatch"; exit 1; }
          mkdir -p "$RUNNER_TEMP/src"
          unzip -q "$zip" -d "$RUNNER_TEMP/src"
          dir="$RUNNER_TEMP/src/Sun-VPN"
          version=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['version'])" "$dir/package.json")
          [ "$(basename "$zip")" = "Sun-VPN-$version-source.zip" ] || { echo "Archive name does not match version $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          chmod +x "$dir/src-tauri/gen/android/gradlew" "$dir/scripts/build-libbox.sh"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Android SDK and NDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platform-tools" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "ndk;28.0.13004108" > /dev/null
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME"
            echo "NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108"
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108"
          } >> "$GITHUB_ENV"
      - name: Frontend and core tests
        working-directory: ${{ steps.source.outputs.dir }}
        run: |
          npm ci
          npm test
          cargo test --locked -p luma-core
      - name: Build libbox (sing-box 1.12.0 for Android)
        working-directory: ${{ steps.source.outputs.dir }}
        run: ./scripts/build-libbox.sh
      - name: Release signing
        working-directory: ${{ steps.source.outputs.dir }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            store="$RUNNER_TEMP/release.jks"; pass="$KEYSTORE_PASSWORD"; alias="${KEY_ALIAS:-sunvpn}"
            echo "Signing with the repository secret key"
          else
            store="$PWD/android-signing/sun-vpn-release.jks"; pass="sunvpn-public"; alias="sunvpn"
            echo "Signing with the public project key (android-signing/README.txt)"
          fi
          {
            echo "storeFile=$store"
            echo "storePassword=$pass"
            echo "keyAlias=$alias"
            echo "keyPassword=$pass"
          } > src-tauri/gen/android/keystore.properties
      - name: Build APK
        working-directory: ${{ steps.source.outputs.dir }}
        run: |
          # Mobile Tauri builds the app as a library: add the library crate types here
          # (the Windows build keeps the plain rlib it has always used).
          sed -i 's/crate-type = \["rlib"\]/crate-type = ["staticlib", "cdylib", "rlib"]/' src-tauri/Cargo.toml
          grep -n 'crate-type' src-tauri/Cargo.toml
          npx tauri android build --apk --target aarch64 --ci
      - name: Inspect and sign-check the APK
        id: apk
        env:
          VERSION: ${{ steps.source.outputs.version }}
          DIR: ${{ steps.source.outputs.dir }}
        run: |
          apk=$(find "$DIR/src-tauri/gen/android/app/build/outputs/apk" -name '*.apk' | head -1)
          [ -n "$apk" ] || { echo "No APK produced"; exit 1; }
          echo "APK: $apk ($(stat -c %s "$apk") bytes)"
          bt="$ANDROID_HOME/build-tools/35.0.0"
          "$bt/apksigner" verify --verbose --print-certs "$apk"
          "$bt/aapt2" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
          grep -E "^package:|application-label:|sdkVersion|targetSdkVersion|uses-permission" "$RUNNER_TEMP/badging.txt"
          grep -q "name='app.luma.desktop'" "$RUNNER_TEMP/badging.txt"
          grep -q "versionName='$VERSION'" "$RUNNER_TEMP/badging.txt"
          grep -q "android.permission.FOREGROUND_SERVICE" "$RUNNER_TEMP/badging.txt"
          unzip -l "$apk" | grep -E "lib/arm64-v8a" | tee "$RUNNER_TEMP/libs.txt"
          grep -q "libluma_vpn_lib.so" "$RUNNER_TEMP/libs.txt"
          grep -q "libbox.so" "$RUNNER_TEMP/libs.txt"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
      - name: Publish APK
        env:
          VERSION: ${{ steps.source.outputs.version }}
          APK: ${{ steps.apk.outputs.apk }}
        run: |
          name="Sun-VPN-$VERSION-Android-arm64.apk"
          cp "$APK" "downloads/$name"
          (cd downloads && sha256sum "$name" > "$name.sha256" && cat "$name.sha256")
          git config user.name 'Sun VPN release automation'
          git config user.email 'sun-vpn-build@users.noreply.github.com'
          git add downloads
          git diff --cached --quiet || git commit -m "Publish Sun VPN $VERSION Android APK (built on ubuntu-latest, not distributed by Google Play)"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((attempt * 7))
          done
          echo "Could not push the APK"; exit 1

  # Runs the same source on an Android emulator (hardware-accelerated) against a real
  # Shadowsocks server on the runner: the VPN must carry traffic only while it is up.
  # x86_64 debug build of the identical code (the release APK is arm64).
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Verify and unpack source archive
        id: source
        run: |
          zip=$(ls downloads/Sun-VPN-*-source.zip | sed -E 's#.*/Sun-VPN-(.*)-source\.zip#\1 &#' | sort -V | tail -1 | cut -d' ' -f2)
          expected=$(cut -d' ' -f1 "$zip.sha256")
          actual=$(sha256sum "$zip" | cut -d' ' -f1)
          [ "$actual" = "$expected" ] || { echo "Source archive SHA-256 mismatch"; exit 1; }
          mkdir -p "$RUNNER_TEMP/src"
          unzip -q "$zip" -d "$RUNNER_TEMP/src"
          echo "dir=$RUNNER_TEMP/src/Sun-VPN" >> "$GITHUB_OUTPUT"
          chmod +x "$RUNNER_TEMP/src/Sun-VPN/src-tauri/gen/android/gradlew" "$RUNNER_TEMP/src/Sun-VPN/scripts/"*.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - name: Android SDK and NDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platform-tools" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "ndk;28.0.13004108" > /dev/null
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME"
            echo "NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108"
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108"
          } >> "$GITHUB_ENV"
      - name: Build libbox
        working-directory: ${{ steps.source.outputs.dir }}
        run: ./scripts/build-libbox.sh
      - name: Build x86_64 debug APK
        working-directory: ${{ steps.source.outputs.dir }}
        run: |
          npm ci
          sed -i 's/crate-type = \["rlib"\]/crate-type = ["staticlib", "cdylib", "rlib"]/' src-tauri/Cargo.toml
          npx tauri android build --debug --apk --target x86_64 --ci
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)
          cp "$apk" "$RUNNER_TEMP/sun-vpn-debug.apk"
      - name: Test configuration and server tool
        working-directory: ${{ steps.source.outputs.dir }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/sb.tgz" https://github.com/SagerNet/sing-box/releases/download/v1.12.0/sing-box-1.12.0-linux-amd64.tar.gz
          echo "f59b1253ae0143997cb46915af30d14a33431dcbd7e39edacfcde8d73050faaf  $RUNNER_TEMP/sb.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/sb.tgz" -C "$RUNNER_TEMP"
          cargo run -q -p luma-core --example android_config -- "ss://$(printf 'aes-128-gcm:password' | base64 -w0)@10.0.2.2:8388#test" "$RUNNER_TEMP/session.json"
          "$RUNNER_TEMP/sing-box-1.12.0-linux-amd64/sing-box" check -c "$RUNNER_TEMP/session.json"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: End-to-end test on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          working-directory: ${{ steps.source.outputs.dir }}
          script: timeout 1500 ./scripts/android-e2e.sh ${{ runner.temp }}/sun-vpn-debug.apk ${{ runner.temp }}/sing-box-1.12.0-linux-amd64/sing-box ${{ runner.temp }}/session.json
