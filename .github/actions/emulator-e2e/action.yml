name: Emulator end-to-end attempt
description: Boots a fresh Android emulator and runs scripts/android-e2e.sh (one attempt).
inputs:
  dir:
    description: Source directory (contains scripts/android-e2e.sh)
    required: true
  apk:
    description: Debug APK to test
    required: true
  singbox:
    description: sing-box binary for the host-side Shadowsocks server
    required: true
  config:
    description: sing-box config the app runs
    required: true
  emulator-log:
    description: File for the emulator-side guest log
    required: true
  api-level:
    description: Android API level of the emulator image
    required: true
runs:
  using: composite
  steps:
    - uses: reactivecircus/android-emulator-runner@v2
      with:
        # No app window is drawn (see scripts/android-e2e.sh): an app holding the VPN
        # permission may start its service from the background on every Android version.
        api-level: ${{ inputs.api-level }}
        arch: x86_64
        # AOSP image: no Google services eating the runner's CPU and memory.
        target: default
        ram-size: 4096M
        heap-size: 576M
        disk-size: 8192M
        emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -feature -Vulkan -logcat '*:V' -logcat-output ${{ inputs.emulator-log }}
        disable-animations: true
        working-directory: ${{ inputs.dir }}
        script: EMU_LOGCAT=${{ inputs.emulator-log }} timeout 1500 ./scripts/android-e2e.sh ${{ inputs.apk }} ${{ inputs.singbox }} ${{ inputs.config }}
